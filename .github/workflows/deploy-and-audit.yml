name: Deploy to GitHub Pages and Run PageSpeed Audit

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-config-file: package.json
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  lighthouse-audit:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Lighthouse Audit
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://ponochovny.github.io/astro-pagespeed/
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Output PageSpeed Summary
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = '.lighthouseci/manifest.json';

            if (!fs.existsSync(path)) {
              core.setFailed('Lighthouse results file not found.');
              return;
            }

            const manifest = JSON.parse(fs.readFileSync(path, 'utf8'));
            if (!manifest.length) return;

            let summaryMarkdown = '## ⚡ Google PageSpeed / Lighthouse Results\n\n';
            summaryMarkdown += '| URL | Performance | Accessibility | Best Practices | SEO | Detailed Report |\n';
            summaryMarkdown += '| --- | :---: | :---: | :---: | :---: | :---: |\n';

            manifest.forEach(run => {
              const summary = run.summary;
              const formatScore = (val) => {
                const score = Math.round(val * 100);
                const emoji = score >= 90 ? '🟢' : score >= 50 ? '🟠' : '🔴';
                return `${emoji} **${score}**`;
              };

              const perf = formatScore(summary.performance);
              const a11y = formatScore(summary.accessibility);
              const bp = formatScore(summary['best-practices']);
              const seo = formatScore(summary.seo);
              const reportLink = run.htmlUrl ? `[View HTML Report](${run.htmlUrl})` : 'N/A';

              summaryMarkdown += `| \`${run.url}\` | ${perf} | ${a11y} | ${bp} | ${seo} | ${reportLink} |\n`;
            });

            await core.summary.addRaw(summaryMarkdown).write();
