name: Deploy to GitHub Pages and Run PageSpeed Audit

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-config-file: package.json
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  lighthouse-audit:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Lighthouse Audit
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://ponochovny.github.io/astro-pagespeed/
          uploadArtifacts: true
          temporaryPublicStorage: true

  pagespeed-audit:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    steps:
      - name: PageSpeed Insights Audit (Mobile)
        uses: fcorti/mktg-pagespeed-action@v1.0.1
        with:
          url: 'https://ponochovny.github.io/astro-pagespeed/'
          strategy: 'mobile'
          category: 'performance'

      - name: PageSpeed Insights Audit (Desktop)
        uses: fcorti/mktg-pagespeed-action@v1.0.1
        with:
          url: 'https://ponochovny.github.io/astro-pagespeed/'
          strategy: 'desktop'
          category: 'performance'
